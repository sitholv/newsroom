{% extends "publishing/base.html" %}
{% block title %}
    Log in
{% endblock %}
{% block content %}
    <h1>Log in</h1>
    <form method="post" class="panel editor-form">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div class="field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>
        {% endfor %}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Log in</button>
    </form>
{% endblock %}
