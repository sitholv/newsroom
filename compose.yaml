name: vs26060020556-consolidation

services:
  web:
    build: .
    image: vs26060020556/newsroom:1.0
    environment:
      DB_NAME: newsroom
      DB_USER: newsroom
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD locally}
      DB_HOST: database
      DB_PORT: "3306"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a private signing key}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      INTERNAL_APPROVAL_SECRET: ${INTERNAL_APPROVAL_SECRET:?Set an internal secret}
      INTERNAL_APPROVAL_URL: http://127.0.0.1:8000/api/approved/
    ports:
      - "127.0.0.1:8018:8000"
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: newsroom
      MARIADB_USER: newsroom
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for the local database}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD locally}
    ports:
      - "127.0.0.1:33317:3306"
    volumes:
      - newsroom-data:/var/lib/mysql
      - ./docker/test-database.sql:/docker-entrypoint-initdb.d/test-database.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  newsroom-data:
