<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#222"/></marker></defs>
<rect width="1100" height="760" fill="white"/>
<g font-family="Arial,sans-serif" fill="#171717">
<text x="40" y="42" font-size="25">Newsroom · Approval and notification sequence</text><text x="40" y="70" font-size="14">Vusi Sithole · VS26060020556 · View/service approach (without an approval signal)</text>
<g fill="#eee"><rect x="30" y="100" width="130" height="45"/><rect x="230" y="100" width="170" height="45"/><rect x="475" y="100" width="160" height="45"/><rect x="710" y="100" width="130" height="45"/><rect x="890" y="100" width="180" height="45"/></g>
<g font-size="16" text-anchor="middle"><text x="95" y="129">Editor</text><text x="315" y="129">View / service</text><text x="555" y="129">MariaDB</text><text x="775" y="129">Mail backend</text><text x="980" y="129">Own HTTP API</text></g>
<g stroke="#aaa" stroke-dasharray="5 5"><path d="M95 145V680M315 145V680M555 145V680M775 145V680M980 145V680"/></g>
<g stroke="#222" fill="none" marker-end="url(#a)"><path d="M95 190H315"/><path d="M315 245H555"/><path d="M555 300H315"/><path d="M315 365H775"/><path d="M775 415H315"/><path d="M315 465H555"/><path d="M315 520H980"/><path d="M980 565H555"/><path d="M980 615H315"/><path d="M315 665H95"/></g>
<g font-size="14"><text x="110" y="178">POST approve (login + CSRF / token)</text><text x="330" y="232">Check editor; lock article; approve</text><text x="330" y="278">Create one delivery + recipient snapshot</text><text x="330" y="290">COMMIT before external HTTP</text><text x="330" y="352">BCC deduplicated author/publisher subscribers</text><text x="420" y="402">Backend accepts email or raises error</text><text x="330" y="452">Persist email completion independently</text><text x="360" y="507">requests.POST /api/approved/ + secret + article_id</text><text x="640" y="552">Authenticate; verify approved; get/create log</text><text x="620" y="602">201 first log / 200 repeated log; article_id</text><text x="110" y="652">Redirect/detail with accurate pending/completed state</text></g>
<text x="40" y="715" font-size="14">Retry only incomplete steps. Successful email is not resent after HTTP failure. SMTP crash-boundary duplication remains possible.</text><text x="40" y="739" font-size="14">Readers/journalists cannot approve. Invalid internal secrets fail with 403; unpublished articles are not logged.</text>
</g></svg>
